[project]
name = "package-sdk"
version = "0.1.0"
description = "Tools and library for authoring catalog packages: checks, tests executed by the core, installation plans, connector runtime (TAI-ADR-0062)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Checks and tests without a running core: the domain modules of the core itself
# (process definitions, engine, expressions, calendars, rules) — no second engine.
sandbox = ["control-plane"]
# Observer runtime: publishes observations, knowledge snapshots and documents
# through the canonical core client.
connector = ["control-plane-client"]
# Test pyramid: contracts of the package's skills against their code
# (`skill-sdk export --check`, TAI-ADR-0045).
skills = ["skill-sdk"]
# MCP server of the package author (`package-sdk mcp`): the stand credential is found by the
# canonical core client, as for the operator.
mcp = ["mcp>=2.0.0", "control-plane-client"]
all = ["package-sdk[sandbox,connector,skills,mcp]"]

[project.scripts]
package-sdk = "package_sdk.cli:main"

[tool.uv.sources]
control-plane = { path = "../control-plane", editable = true }
control-plane-client = { path = "../control-plane/client", editable = true }
skill-sdk = { path = "../skill-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/package_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "package_sdk/schemas"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Фикстуры — пакеты с их собственными тестами (код интеграции): их гоняет `package-sdk test`
# в подпроцессе, а не pytest SDK.
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "node_modules", "fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Перенесено из tools/cp_packages.py, tools/pkg.py, tools/package_sandbox.py суперпроекта
# без правки тел функций (S006, паритет поведения): длинные строки справки и сообщений,
# замыкания проверки ссылок, вызываемые в той же итерации цикла. Сводится при
# переписывании установки (S013).
"src/package_sdk/{model,source,check,apply,core,migrate,commands,edit,sandbox}.py" = ["E501", "B023", "RUF005"]
# Фикстуры тестов установки (поддельное ядро) импортируются в тесты MCP-сервера автора и
# авторизации и приходят параметрами тестов.
"tests/{test_mcp,test_auth}.py" = ["F811"]
# Тесты инструментов перенесены из tools/tests суперпроекта как есть (S006).
"tests/umbrella/*.py" = ["E501", "B023", "RUF005", "RUF012", "RUF015", "RUF043", "SIM", "B", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["package_sdk"]
ignore_missing_imports = true

# Перенесено из tools/ суперпроекта без правки тел функций (S006): под strict он не
# писался. Модули уходят из этого списка по одному, когда их типы доведены: model,
# source и core — в S013 (установка — новый strict-модуль package_sdk.install).
[[tool.mypy.overrides]]
module = [
    "package_sdk.check",
    "package_sdk.apply",
    "package_sdk.migrate",
    "package_sdk.commands",
    "package_sdk.edit",
    "package_sdk.sandbox",
]
ignore_errors = true
