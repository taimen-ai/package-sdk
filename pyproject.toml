[project]
name = "package-sdk"
version = "0.2.0"
description = "Tools and library for authoring catalog packages: checks, tests executed by the core, installation plans, connector runtime (TAI-ADR-0062)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# Checks and tests without a running core: the domain modules of the core itself
# (process definitions, engine, expressions, calendars, rules) — no second engine.
sandbox = ["control-plane"]
# Observer runtime: publishes observations, knowledge snapshots and documents
# through the canonical core client.
connector = ["control-plane-client"]
# Test pyramid: contracts of the package's skills against their code
# (`skill-sdk export --check`, TAI-ADR-0045).
skills = ["skill-sdk"]
# MCP server of the package author (`package-sdk mcp`): the stand credential is found by the
# canonical core client, as for the operator.
mcp = ["mcp>=2.0.0", "control-plane-client"]
all = ["package-sdk[sandbox,connector,skills,mcp]"]

[project.scripts]
package-sdk = "package_sdk.cli:main"

[tool.uv.sources]
control-plane = { path = "../../services/control-plane", editable = true }
control-plane-client = { path = "../../services/control-plane/client", editable = true }
skill-sdk = { path = "../skill-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/package_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "package_sdk/schemas"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixtures are packages with tests of their own (integration code): `package-sdk test` runs
# them in a subprocess, not the SDK's pytest.
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "node_modules", "fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Moved from tools/cp_packages.py, tools/pkg.py, tools/package_sandbox.py of the superproject
# without editing function bodies (S006, behaviour parity): long help and message lines,
# reference-check closures called within the same loop iteration. To be reduced when the
# installation is rewritten (S013).
"src/package_sdk/{model,source,check,apply,core,migrate,commands,edit,sandbox}.py" = ["E501", "B023", "RUF005"]
# Installation test fixtures (a fake core) are imported into the tests of the author's MCP
# server and of authorization and arrive as test parameters.
"tests/{test_mcp,test_auth}.py" = ["F811"]
# Tool tests moved from tools/tests of the superproject as they were (S006).
"tests/umbrella/*.py" = ["E501", "B023", "RUF005", "RUF012", "RUF015", "RUF043", "SIM", "B", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["package_sdk"]
ignore_missing_imports = true

# Moved from tools/ of the superproject without editing function bodies (S006): it was not
# written for strict. Modules leave this list one by one as their types are completed: model,
# source and core in S013 (installation is the new strict module package_sdk.install).
[[tool.mypy.overrides]]
module = [
    "package_sdk.check",
    "package_sdk.apply",
    "package_sdk.migrate",
    "package_sdk.commands",
    "package_sdk.edit",
    "package_sdk.sandbox",
]
ignore_errors = true
