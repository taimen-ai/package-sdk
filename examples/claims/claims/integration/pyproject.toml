[project]
name = "claims-integration"
version = "0.1.0"
description = "Integration code of the package claims: the helpdesk observer and the skills"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# The helpdesk client is the standard library. package-sdk[connector] (the observer),
# skill-sdk (the skills) and the core client come from the base images of the platform
# or a pinned source (git+https://…@<tag>), never from the public index: they are not
# listed here.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_helpdesk"]
