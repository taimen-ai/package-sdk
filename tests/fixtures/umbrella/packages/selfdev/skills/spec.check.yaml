# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Сгенерировано skill-sdk из кода — правьте код и перегенерируйте (TAI-ADR-0045).
apiVersion: taimen.ai/v1
kind: Skill
key: spec.check
spec:
  version: '1'
  description: 'Проверить spec фичи: нет неясностей, есть секции, FR/SC пронумерованы'
  sideEffects: none
  riskLevel: low
  contract:
    inputs:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - repository
      - path
      additionalProperties: false
      properties:
        repository:
          type: string
          minLength: 1
        ref:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
          maxLength: 300
          pattern: ^[^/\\.][^\\]*\.md$
    outputs:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - ref
      - status
      - gaps
      - stats
      properties:
        ref:
          type: string
        status:
          enum:
          - ok
          - gaps
        gaps:
          type: array
          items:
            type: object
            required:
            - kind
            - line
            - detail
            properties:
              kind:
                type: string
              line:
                type: integer
              detail:
                type: string
        stats:
          type: object
          additionalProperties:
            type: integer
    idempotency: natural
    timeoutSeconds: 300
    retryPolicy:
      maxAttempts: 2
      backoffSeconds: 30
    implementation:
      protocol: local
      entrypoint: taimen_selfdev.sdd_checks:invoke_spec
