# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Кодовый исполнитель notification-service.
# Агент описанием (TAI-ADR-0052): личность, работа, исполнитель, рабочая копия и
# размещение; запускает платформа на узле fleet.
apiVersion: taimen.ai/v1
kind: Agent
key: notify-coder
spec:
  displayName: Notification coder (notification-service)
  identity:
    kind: agent
    permissions:
    - approvals.manage
    - approvals.read
    - artifacts.read
    - artifacts.write
    - claims.manage
    - events.read
    - goals.read
    - goals.write
    - observations.write
    - projects.read
    - rules.read
    - sessions.open
    - task_types.read
    - tasks.claim
    - tasks.read
    - tasks.write
    - workspaces.read
  work:
    workspace: ${SELFDEV_WORKSPACE_ID}
    onlyAssigned: true
  executor:
    kind: claude-code
    params:
      model: claude-opus-5-5
      permissionMode: bypassPermissions
      timeoutSeconds: 10800
    instructions: |
      # Соглашения для агента-исполнителя notification-service

      Этот текст добавляется к каждому prompt исполнителя (`CONTROL_PLANE_CLAUDE_PROMPT_FILE`).

      ## Среда

      - Рабочая копия — текущий каталог (`notification-service`). Соседи
        `../platform-auth-sdk`, `../control-plane` и `../iam-service` стоят на ревизиях,
        закреплённых суперпроектом, и доступны **только для чтения**.
      - Дизайн фичи — `specs/notifications/` суперпроекта (spec, plan, tasks); читай его
        через `gh api repos/acme/umbrella/contents/specs/notifications/…`.
      - **Контракт другого сервиса не выдумывай.** Вызовы Control Plane — через клиент
        `../control-plane/client` и схемы `../control-plane/src/control_plane/api/v1/schemas.py`;
        IAM — по коду `../iam-service`. Закрепляй contract-тестами против их моделей.
      - Проверка токенов — только через `platform-auth-sdk`, заново не писать (ADR-0030).
      - Сервис нейтрален к домену: никаких понятий конкретного бизнеса в коде; типы и
        тексты уведомлений приходят от отправителя.
      - Тестовая PostgreSQL уже запущена рядом, адрес — в `NS_TEST_DATABASE_URL`. Docker
        внутри нет. Внешние API (Telegram Bot API, SMTP) в тестах — фейками по их
        документированному контракту.
      - Тестовая база одна на весь раннер: **одновременно — только один прогон тестов**, и
        не в фоне. Если прогон молчит дольше нескольких минут — останови его и разберись,
        а не запускай новый.

      ## Правила

      - Архитектурные решения — в ADR (`docs/adr/` сервиса; решения уровня платформы — ADR суперпроекта). Меняешь контракт API, схему
        БД или поведение, описанное в ADR, — обнови или дополни ADR в том же коммите.
      - Номер нового ADR — следующий свободный в `docs/adr/` на `origin/main` на момент
        коммита: параллельные ветки уже занимали один номер (0056).
      - Документация — на русском; комментарии в коде — английские, имена API и сущностей —
        на английском.
      - Не коммить секреты, локальные абсолютные пути, `.env`, артефакты сборки.
      - Не трогай `main` и чужие ветки: демон сам коммитит и публикует ветку задачи.
      - Не делай того, чего нет в задаче. Найденное попутно — в отчёт, а не в код.

      ## Отчёт

      Первой строкой — что сделано, одной фразой. Дальше: изменённые места, какие тесты
      прогнаны и с каким результатом, что осталось или требует решения человека. Ревью
      делает человек через approval, поэтому отчёт должен позволять проверить работу
      без повторного исследования.
  workingCopy:
    repository: https://git.example.com/acme/taimen-notification-service.git
    directory: notification-service
    baseRef: main
    neighbours:
      platform-auth-sdk: https://git.example.com/acme/taimen-platform-auth-sdk.git
      control-plane: https://git.example.com/acme/taimen-control-plane.git
      iam-service: https://git.example.com/acme/taimen-iam-service.git
    superproject: https://git.example.com/acme/umbrella.git
    publish: true
  placement:
    requires:
    - claude-subscription
    - repos
    secrets:
    - claude-oauth-token
    - github-token
    resources:
      cpus: 2
      memoryMb: 4096
    drainSeconds: 14400
  state: running
