# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Пара к oss-check-red: релиз компонента опубликован (снимок и тег уже в зеркале) или
# релиза на закреплённой ревизии нет — работа «релиз не публикуется» закрывается как
# выполненная (complete_work, CP-ADR-0063 амендмент M1.6).
apiVersion: taimen.ai/v1
kind: WorkRule
key: oss-check-resolved
spec:
  description: Релиз компонента опубликован — работа «релиз не публикуется» выполнена
  workspaceId: ${SELFDEV_WORKSPACE_ID}
  identity: {agent: selfdev-rules}
  trigger: {kind: observation, type: repo.commit_observed}
  condition: {eq: [{var: payload.data.repo}, project-taimen-ai]}
  interpretation:
    skill: oss.check@2
    inputs:
      superproject: ${SELFDEV_SUPERPROJECT_URL}
      ref: "{{payload.data.sha}}"
  action:
    kind: complete_work
    forEach: skill.output.current
    dedupKeyTemplate: "oss-check:{{item.component}}"
