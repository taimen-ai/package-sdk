# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг calculate-price (стадия pricing). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-price-calculation
spec:
  displayName: Расчёт цены заявки
  description: >-
    Расчёт цены заявки. В контексте — цены и итоги прошлых закупок заказчика и того же ОКПД2 и уроки; подготовивший расчёт его не согласует.
  fieldSchema:
    type: object
    required: [amount, rationale]
    properties:
      amount: {type: number, exclusiveMinimum: 0, description: "Цена заявки, ₽"}
      margin: {type: number, description: "Маржа, %"}
      rationale: {type: string, minLength: 1, maxLength: 4000, description: Обоснование}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Рассчитайте цену заявки. Опирайтесь на НМЦК, себестоимость и историю: цены победителей прошлых закупок этого заказчика и того же ОКПД2 и уроки закрытых дел в контексте задачи. Расчёт согласуют по таблице approval-thresholds; вы сами его согласовать не сможете (разделение обязанностей).
