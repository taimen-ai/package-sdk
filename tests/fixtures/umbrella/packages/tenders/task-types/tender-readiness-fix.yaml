# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг fix-readiness (стадия preparation). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-readiness-fix
spec:
  displayName: Устранить неготовность заявки
  description: >-
    Детерминированная проверка готовности к подаче не прошла; во входе задачи — какая именно.
  fieldSchema:
    type: object
    properties:
      documents: {type: array, maxItems: 100, items: {type: string, maxLength: 300}}
      declarationsConfirmed: {type: boolean}
      guaranteeProvided: {type: boolean}
      comment: {type: string, maxLength: 2000}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Проверка готовности к подаче не прошла (во входе — `checks`). Исправьте то, что не прошло, и заполните исправленные поля; после задачи проверка повторится. Цену, не прошедшую согласование, здесь не исправить.
