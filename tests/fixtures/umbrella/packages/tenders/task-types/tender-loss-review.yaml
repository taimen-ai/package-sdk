# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг loss-review (стадия closing). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-loss-review
spec:
  displayName: Разбор проигрыша
  description: >-
    Почему закупка проиграна — факт дела для базы знаний.
  fieldSchema:
    type: object
    required: [reason]
    properties:
      reason: {enum: [price, rejected, requirements, late, other], description: Главная причина}
      comment: {type: string, maxLength: 4000}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Укажите главную причину проигрыша. Цена победителя — во входе задачи. Причина попадёт в дело в базе знаний; уроки предложит разбор дела после закрытия.
