# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг review-draft (стадия contract). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-contract-review
spec:
  displayName: Проверить проект контракта
  description: >-
    Юрист сверяет проект контракта с извещением и заявкой.
  fieldSchema:
    type: object
    required: [disagreements]
    properties:
      disagreements: {type: boolean, description: Нужен протокол разногласий}
      points: {type: string, maxLength: 4000}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Сверьте проект контракта, размещённый заказчиком, с извещением и заявкой. Расхождения — `disagreements: true` и пункты: протокол разногласий размещается один раз в срок подписания (ч. 3 ст. 51 44-ФЗ).
