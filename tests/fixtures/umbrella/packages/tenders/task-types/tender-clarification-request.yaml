# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг ask-customer (стадия analysis). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-clarification-request
spec:
  displayName: Подать запрос разъяснений
  description: >-
    Юрист подаёт запрос разъяснений на электронной площадке своей электронной подписью; процесс ждёт ответа заказчика в ЕИС.
  fieldSchema:
    type: object
    required: [requestNumber]
    properties:
      requestNumber: {type: string, minLength: 1, maxLength: 100, description: Номер запроса на площадке}
      sentAt: {type: string, format: date-time}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Подайте запрос разъяснений с вопросами из входа задачи на электронной площадке (действие с вашей электронной подписью — платформа его не выполняет) и укажите номер запроса. Ответ заказчика процесс получит из ЕИС сам.
