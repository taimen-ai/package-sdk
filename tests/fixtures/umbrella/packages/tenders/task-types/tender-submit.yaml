# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг submit (стадия submission). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-submit
spec:
  displayName: Подать заявку
  description: >-
    Подача заявки на электронной площадке — только человеком своей электронной подписью (FR-044).
  fieldSchema:
    type: object
    required: [signedWithOwnSignature, applicationNumber, submittedAt]
    properties:
      signedWithOwnSignature: {const: true, description: Заявка подписана моей электронной подписью}
      applicationNumber: {type: string, minLength: 1, maxLength: 100, description: Номер заявки на площадке}
      submittedAt: {type: string, format: date-time}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Подайте заявку на электронной площадке своей электронной подписью: платформа заявку не подаёт и подпись не использует. Пакет документов — во входе задачи. Укажите номер заявки: по нему процесс узнает результат в протоколе ЕИС.
