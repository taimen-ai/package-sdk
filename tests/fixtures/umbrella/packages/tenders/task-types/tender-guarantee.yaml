# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Тип задачи процесса tender — шаг application-guarantee (стадия preparation). Форма: fieldSchema (данные задачи, по ним
# ядро проверяет завершение и типизирует step.result); представление (uischema) —
# у шага процесса (processForm), схема каталога у типа задачи его не держит.
apiVersion: taimen.ai/v1
kind: TaskType
key: tender-guarantee
spec:
  displayName: Обеспечение заявки
  description: >-
    Финансы обеспечивают заявку: средства на специальном счёте или независимая гарантия.
  fieldSchema:
    type: object
    required: [provided]
    properties:
      provided: {type: boolean}
      form: {enum: [special-account, bank-guarantee]}
      reference: {type: string, maxLength: 300}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  approvalSchema: {}
  instructions: |
    Обеспечьте заявку на сумму из извещения (размер — во входе задачи) и отметьте `provided`.
