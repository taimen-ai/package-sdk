# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Сгенерировано skill-sdk из кода — правьте код и перегенерируйте (TAI-ADR-0045).
apiVersion: taimen.ai/v1
kind: Skill
key: tender.check_requirements
spec:
  version: '1'
  description: Проверить требования к участнику по кодам извещения и базе знаний компании
  sideEffects: none
  riskLevel: low
  contract:
    inputs:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        purchase:
          additionalProperties: true
          title: Purchase
          type: object
        company:
          additionalProperties: true
          description: Ответ recall о компании
          title: Company
          type: object
        matches:
          additionalProperties: true
          description: Выход tender.match_items@1
          title: Matches
          type: object
        documents:
          description: Артефакты документов закупки {id, fileName, content}
          items:
            additionalProperties: true
            type: object
          maxItems: 20
          title: Documents
          type: array
        obligations:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Текущие обязательства, сумма
          title: Obligations
        asOf:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Asof
        requireAi:
          default: false
          title: Requireai
          type: boolean
      required:
      - purchase
      title: CheckIn
      type: object
    outputs:
      $schema: https://json-schema.org/draft/2020-12/schema
      $defs:
        Check:
          properties:
            id:
              title: Id
              type: string
            title:
              title: Title
              type: string
            status:
              enum:
              - met
              - not_met
              - unknown
              title: Status
              type: string
            blocker:
              default: false
              title: Blocker
              type: boolean
            warning:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Warning
            note:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Note
            source:
              $ref: '#/$defs/Source'
            evidence:
              items:
                $ref: '#/$defs/Source'
              title: Evidence
              type: array
          required:
          - id
          - title
          - status
          - source
          title: Check
          type: object
        Source:
          properties:
            type:
              enum:
              - notice_field
              - document
              - knowledge
              - lesson
              - rule
              title: Type
              type: string
            ref:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Ref
            artifactId:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Artifactid
            section:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Section
            quote:
              anyOf:
              - type: string
              - type: 'null'
              default: null
              title: Quote
            inferred:
              default: false
              title: Inferred
              type: boolean
          required:
          - type
          title: Source
          type: object
      properties:
        status:
          enum:
          - ok
          - partial
          title: Status
          type: string
        checks:
          items:
            $ref: '#/$defs/Check'
          title: Checks
          type: array
        blockers:
          items:
            type: string
          title: Blockers
          type: array
        warnings:
          items:
            type: string
          title: Warnings
          type: array
        aiPending:
          default: false
          title: Aipending
          type: boolean
        summary:
          title: Summary
          type: string
      required:
      - status
      - checks
      - blockers
      - warnings
      - summary
      title: CheckOut
      type: object
    idempotency: natural
    timeoutSeconds: 600
    retryPolicy:
      maxAttempts: 1
      backoffSeconds: 0
    implementation:
      protocol: local
      entrypoint: taimen_tenders.check_requirements:invoke
