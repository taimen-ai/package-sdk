# yaml-language-server: $schema=../../../../../../schema/v1/test.schema.json
# Перенос срока (сценарий 5): сроки считаются назад от окончания подачи по
# производственному календарю ru. Заказчик переносит окончание подачи с пятницы 8 мая
# на вторник 12 мая 2026 (1 и 11 мая — праздники): изменение извещения переписывает
# данные закупки, таймеры, читающие срок, пересчитываются (старое и новое время — в
# событии process.timer_rescheduled), строка таблицы сроков вычисляется заново.
# «За три рабочих дня» до 12 мая — это 6 мая, а не календарные 9-е (суббота).
process: tender
name: перенос срока подачи — таймеры по календарю пересчитаны
given:
  clock: "2026-04-24T10:00:00+03:00"
  principals: {tender-lead: [alice, bob], tender-lawyer: [lena], tender-finance: [fin], general-director: [gd]}
mocks:
  recall:
    - {step: recall-company, output: {nodes: [{kind: legal_entity, key: "7707083893", anchor: true, attributes: {own: true, smallBusiness: true}}], edges: []}}
    - {step: recall-roles, output: {nodes: [], edges: []}}
    - {step: recall-offerings, output: {nodes: [], edges: []}}
    - {output: {nodes: []}}
  skills:
    tender.match_items@1:
      - output: {status: ok, items: [], coverage: {count: 0, total: 0, sumShare: "0"}, executor: {}, aiPending: false, summary: позиций нет}
    tender.check_requirements@1:
      - output: {status: ok, checks: [], blockers: [], warnings: [], aiPending: false, summary: требований нет}
    tender.analyze_docs@2:
      - output:
          status: ok
          summary: ok
          risks: []
          blockers: []
          questions: []
          recommendation: {decision: go, rationale: блокеров нет}
steps:
  - emit:
      observation: procurement.notice_published
      source: eis
      payload:
        kind: procurement.notice_published
        data:
          kind: notice_published
          purchaseNumber: "0000000000026000005"
          purchase:
            number: "0000000000026000005"
            law: 44-FZ
            method: {code: EAP20, name: Электронный аукцион}
            customer: {name: ГБУ «Тестовый ЦИ», inn: "7700000001"}
            object: Обработка данных
            okpd2: ["63.11.11.000"]
            maxPrice: {amount: "1500000.00", currency: RUB}
            deadlines: {submissionEnd: "2026-05-08T10:00:00+03:00"}
  # 5 рабочих дней до пятницы 8 мая: 7, 6, 5, 4 мая и 30 апреля (1 мая — праздник)
  - expect:
      tasks: [{step: go-no-go, due: "2026-04-30T10:00:00+03:00"}]
      timers: [{id: go-no-go, at: "2026-04-30T10:00:00+03:00"}]
  - emit:
      observation: procurement.notice_changed
      source: eis
      payload:
        kind: procurement.notice_changed
        data:
          kind: notice_changed
          purchaseNumber: "0000000000026000005"
          purchase:
            number: "0000000000026000005"
            law: 44-FZ
            method: {code: EAP20, name: Электронный аукцион}
            customer: {name: ГБУ «Тестовый ЦИ», inn: "7700000001"}
            object: Обработка данных
            okpd2: ["63.11.11.000"]
            maxPrice: {amount: "1500000.00", currency: RUB}
            deadlines: {submissionEnd: "2026-05-12T10:00:00+03:00"}
            version: 2
          changes:
            deadlines:
              submissionEnd: {old: "2026-05-08T10:00:00+03:00", new: "2026-05-12T10:00:00+03:00"}
  # 5 рабочих дней до вторника 12 мая: 8, 7, 6, 5 и 4 мая (11 мая — праздник)
  - expect:
      events: [process.correlated, process.timer_rescheduled, process.data_changed]
      data: {procurement.version: 2, legal.known: true,
             changes.deadlines.submissionEnd.new: "2026-05-12T10:00:00+03:00"}
      timers: [{id: go-no-go, at: "2026-05-04T10:00:00+03:00"}]
  - complete: {step: go-no-go, by: alice, output: {decision: go, reason: да}}
  # последний день запроса разъяснений — 9 мая (за 3 дня), юристу — рабочий день до него
  - expect: {tasks: [{step: legal-review, due: "2026-05-08T10:00:00+03:00"}]}
  - complete: {step: legal-review, by: lena, output: {questionsNeeded: false}}
  - expect: {tasks: [{step: calculate-price, due: "2026-05-06T10:00:00+03:00"}], status: running}
