# yaml-language-server: $schema=../../../../../../schema/v1/test.schema.json
# Проигрыш → закрытие (сценарий 8): электронный конкурс, память не ответила (таймаут
# recall), анализ документации недоступен, вопросов нет, обеспечения заявки нет,
# согласует финансы (НМЦК 10 млн); протокол называет другую заявку — разбор
# проигрыша, цены в память, победитель — из контракта в реестре ЕИС (remember).
process: tender
name: проигрыш — разбор, цены и победитель в памяти
given:
  clock: "2026-10-01T09:00:00+03:00"
  principals: {tender-lead: [alice, bob], tender-lawyer: [lena], tender-finance: [fin], general-director: [gd]}
mocks:
  recall:
    - {step: recall-company, output: {nodes: [{kind: legal_entity, key: "7707083893", anchor: true, attributes: {own: true, smallBusiness: true}}], edges: []}}
    - {step: recall-roles, output: {nodes: [], edges: []}}
    - {step: recall-offerings, output: {nodes: [], edges: []}}
    - {step: recall-prices, output: {nodes: []}}
  skills:
    tender.match_items@1:
      - output: {status: ok, items: [], coverage: {count: 0, total: 0, sumShare: "0"}, executor: {}, aiPending: false, summary: позиций нет}
    tender.check_requirements@1:
      - output: {status: ok, checks: [], blockers: [], warnings: [], aiPending: false, summary: требований нет}
    tender.analyze_docs@2:
      - error: {type: upstream_unavailable, status: 503, detail: модель недоступна}
steps:
  - emit:
      observation: procurement.notice_published
      source: eis
      payload:
        kind: procurement.notice_published
        data:
          kind: notice_published
          purchaseNumber: "0373100000126000044"
          purchase:
            number: "0373100000126000044"
            law: 44-FZ
            method: {code: EOK20, name: Электронный конкурс}
            customer: {name: ФГБУ «Тестовый институт», inn: "7700000003"}
            object: Сопровождение и развитие портала
            okpd2: ["63.11.13.000"]
            maxPrice: {amount: "10000000.00", currency: RUB}
            deadlines: {submissionEnd: "2026-10-26T09:00:00+03:00"}
  # память молчит — через 2 минуты шаг идёт по ветке таймаута
  - expect: {stages: {screening: open}, data: {legal.known: true, legal.notice: 15}}
  - advance: PT2M
  - expect:
      events: [process.recall_timed_out]
      data: {advice.level: new-customer, analysis.status: unavailable}
      tasks: [{step: go-no-go, assignee: alice}]
  - complete: {step: go-no-go, by: bob, output: {decision: go, reason: профильный заказчик}}
  - complete: {step: legal-review, by: lena, output: {questionsNeeded: false}}
  - expect: {stages: {analysis: completed, pricing: open}, data: {clarification.needed: false}}
  - complete: {step: calculate-price, by: bob, output: {amount: 9500000, rationale: рыночная цена}}
  - expect: {data: {approval.level: finance}}
  - approve: {step: approve-price, by: fin, decision: approve}
  # обеспечения заявки нет — ветка сразу готова
  - expect: {tasks: [{step: prepare-documents, assignee: alice}]}
  - complete: {step: prepare-documents, by: bob, output: {documents: [предложение], declarationsConfirmed: true}}
  - expect: {data: {application.checks.guarantee: true, application.ready: true}}
  - complete: {step: submit, by: bob, output: {signedWithOwnSignature: true, applicationNumber: "200000009",
                                               submittedAt: "2026-10-20T11:00:00+03:00"}}
  - advance: P25D
  - emit:
      observation: procurement.protocol
      source: eis
      payload:
        kind: procurement.protocol
        data:
          kind: protocol
          purchaseNumber: "0373100000126000044"
          details:
            protocolKind: results
            protocolDate: "2026-10-30T00:00:00+03:00"
            applications:
              - {number: "200000001", price: "8700000.00", rating: 1}
              - {number: "200000009", price: "9500000.00", rating: 2}
              - {number: "200000004", price: "9900000.00", rating: 3}
            winner: {applicationNumber: "200000001", price: "8700000.00"}
  - expect:
      stages: {results: completed, closing: open, contract: not_started}
      data: {result.won: false, protocol.winnerPrice: 8700000, protocol.participants: 3}
      memory: {remembered: [{facts: {won: false, winnerPrice: 8700000, ourPrice: 9500000, participants: 3}}]}
      tasks: [{step: loss-review, assignee: alice}]
  - complete: {step: loss-review, by: bob, output: {reason: price, comment: победитель дешевле на 8%}}
  - expect: {memory: {remembered: [{facts: {lossReason: price, priceGap: 800000}}]}}
  - advance: P10D
  - emit:
      observation: procurement.contract
      source: eis
      payload:
        kind: procurement.contract
        data:
          kind: contract
          purchaseNumber: "0373100000126000044"
          details:
            contractRegNum: "1770000000326000011"
            price: "8700000.00"
            supplier: {kind: legal_entity, name: ООО «Конкурент», inn: "7700000009"}
  - expect:
      status: completed
      outcome: lost
      data: {winner.inn: "7700000009", winner.price: 8700000}
      memory:
        remembered:
          - entity: {kind: legal_entity, key: "7700000009", name: ООО «Конкурент»,
                     links: [{rel: won, kind: case, key: "tender:0373100000126000044"}]}
      noSideEffects: true
