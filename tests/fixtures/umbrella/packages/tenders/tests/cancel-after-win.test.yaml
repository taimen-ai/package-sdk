# yaml-language-server: $schema=../../../../../../schema/v1/test.schema.json
# Отмена после победы (предписание ФАС отменить закупку): обеспечение исполнения
# контракта уже предоставлено — компенсация ставит финансам задачу освободить его,
# согласование цены отзывается; дело закрыто с исходом cancelled-by-customer.
process: tender
name: отмена на стадии контракта — освобождение обеспечения исполнения
given:
  clock: "2026-10-01T09:00:00+03:00"
  principals: {tender-lead: [alice, bob], tender-lawyer: [lena], tender-finance: [fin], general-director: [gd]}
mocks:
  recall:
    - {step: recall-company, output: {nodes: [{kind: legal_entity, key: "7707083893", anchor: true, attributes: {own: true, smallBusiness: true}}], edges: []}}
    - {step: recall-roles, output: {nodes: [], edges: []}}
    - {step: recall-offerings, output: {nodes: [], edges: []}}
    - {output: {nodes: []}}
  skills:
    tender.match_items@1:
      - output: {status: ok, items: [], coverage: {count: 0, total: 0, sumShare: "0"}, executor: {}, aiPending: false, summary: позиций нет}
    tender.check_requirements@1:
      - output: {status: ok, checks: [], blockers: [], warnings: [], aiPending: false, summary: требований нет}
    tender.analyze_docs@2:
      - output:
          status: ok
          summary: ok
          risks: []
          blockers: []
          questions: []
          recommendation: {decision: go, rationale: блокеров нет}
steps:
  - emit:
      observation: procurement.notice_published
      source: eis
      payload:
        kind: procurement.notice_published
        data:
          kind: notice_published
          purchaseNumber: "0000000000026000023"
          purchase:
            number: "0000000000026000023"
            law: 44-FZ
            method: {code: EAP20, name: Электронный аукцион}
            customer: {name: ГБУ «Тестовый ЦИ», inn: "7700000001"}
            object: Разработка ИС
            okpd2: ["62.01.11.000"]
            maxPrice: {amount: "2000000.00", currency: RUB}
            deadlines: {submissionEnd: "2026-10-19T09:00:00+03:00"}
            contractGuarantee: {amount: "200000.00", partPercent: "10"}
  - complete: {step: go-no-go, by: alice, output: {decision: go, reason: да}}
  - complete: {step: legal-review, by: lena, output: {questionsNeeded: false}}
  - complete: {step: calculate-price, by: alice, output: {amount: 1800000, rationale: расчёт}}
  - approve: {step: approve-price, by: bob, decision: approve}
  - complete: {step: prepare-documents, by: alice, output: {documents: [предложение], declarationsConfirmed: true}}
  - complete: {step: submit, by: alice, output: {signedWithOwnSignature: true, applicationNumber: "500000001",
                                                 submittedAt: "2026-10-16T12:00:00+03:00"}}
  - advance: P20D
  - emit:
      observation: procurement.protocol
      source: eis
      payload:
        kind: procurement.protocol
        data:
          kind: protocol
          purchaseNumber: "0000000000026000023"
          details: {protocolKind: results, winner: {applicationNumber: "500000001", price: "1800000.00"}}
  # обеспечение исполнения — к сроку подписания (2 + 5 рабочих дней от протокола), с эскалацией
  - advance: until:contract-guarantee
  - expect: {events: [process.escalated]}
  - complete: {step: contract-guarantee, by: fin, output: {provided: true}}
  - emit:
      observation: procurement.cancelled
      source: eis
      payload:
        kind: procurement.cancelled
        data: {kind: cancelled, purchaseNumber: "0000000000026000023", details: {reason: Предписание ФАС}}
  - expect: {status: suspended, tasks: [{step: release-contract-guarantee, assignee: fin, status: open}]}
  - complete: {step: release-contract-guarantee, by: fin, output: {released: true}}
  - expect:
      status: completed
      outcome: cancelled-by-customer
      data: {release.contractGuarantee: true, priceApproval.revoked: true}
      tasks: [{step: review-draft, status: cancelled}]
