# yaml-language-server: $schema=../../../../../../schema/v1/test.schema.json
# Отбор по сроку: электронный запрос котировок (извещение за 4 рабочих дня, ст. 42
# ч. 3 п. 3), до окончания подачи два рабочих дня по календарю — не успеть,
# закупка отсеивается с понятной причиной.
process: tender
name: до окончания подачи меньше трёх рабочих дней
given:
  clock: "2026-10-15T09:00:00+03:00"
steps:
  - emit:
      observation: procurement.notice_published
      source: eis
      payload:
        kind: procurement.notice_published
        data:
          kind: notice_published
          purchaseNumber: "0000000000026000015"
          purchase:
            number: "0000000000026000015"
            law: 44-FZ
            method: {code: EZK20, name: Электронный запрос котировок}
            customer: {name: ГБУ «Тестовый ЦИ», inn: "7700000001"}
            object: Лицензии ПО
            okpd2: ["62.01.29.000"]
            maxPrice: {amount: "1100000.00", currency: RUB}
            deadlines: {submissionEnd: "2026-10-19T09:00:00+03:00"}
  - expect:
      status: completed
      outcome: screened-out
      data: {legal.known: true, legal.notice: 4, legal.noticekind: workdays,
             screening.reason: до окончания подачи меньше трёх рабочих дней}
