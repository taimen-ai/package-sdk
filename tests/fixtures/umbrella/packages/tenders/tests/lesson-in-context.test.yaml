# yaml-language-server: $schema=../../../../../../schema/v1/test.schema.json
# Урок прошлого дела в контексте go/no-go (SC-013, сценарии 13 и 15): память через
# ядро отвечает на recall-history делом этого заказчика и подтверждённым уроком из
# него. Ответ записан в данные (replay берёт его из журнала, а не спрашивает память
# снова), таблица go-no-go-advice по нему выбирает строку «есть уроки», а задача go/no-go
# получает профиль контекста: дело, заказчик, уроки по связи applies_to. Решение
# затянулось — эскалации по уровням: напоминание, затем генеральному директору.
process: tender
name: урок прошлого дела заказчика — в данных, в подсказке и в контексте go/no-go
given:
  clock: "2026-10-01T09:00:00+03:00"
  principals: {tender-lead: [alice, bob], tender-lawyer: [lena], tender-finance: [fin], general-director: [gd]}
mocks:
  recall:
    - {step: recall-company, output: {nodes: [{kind: legal_entity, key: "7707083893", anchor: true, attributes: {own: true, smallBusiness: true}}], edges: []}}
    - {step: recall-roles, output: {nodes: [], edges: []}}
    - {step: recall-offerings, output: {nodes: [], edges: []}}
    - step: recall-history
      when: input.anchors[0].key == '7700000001'
      output:
        nodes:
          - {kind: legal_entity, key: "7700000001", title: ГБУ «Тестовый ЦИ», anchor: true}
          - {kind: case, key: "tender:0000000000025000007", title: "Сопровождение ИС учёта",
             attributes: {won: false, lossReason: price}}
          - {kind: lesson, key: "lesson:tender:0000000000025000007/1",
             text: Заказчик снижает цену на переторжке — закладывайте запас в расчёт,
             validFrom: "2025-12-20T00:00:00Z"}
        edges:
          - {relation: customer, from: "tender:0000000000025000007", to: "7700000001"}
          - {relation: applies_to, from: "lesson:tender:0000000000025000007/1", to: "7700000001"}
          - {relation: learned_from, from: "lesson:tender:0000000000025000007/1", to: "tender:0000000000025000007"}
  skills:
    tender.match_items@1:
      - output: {status: ok, items: [], coverage: {count: 0, total: 0, sumShare: "0"}, executor: {}, aiPending: false, summary: позиций нет}
    tender.check_requirements@1:
      - output: {status: ok, checks: [], blockers: [], warnings: [], aiPending: false, summary: требований нет}
    tender.analyze_docs@2:
      - output:
          status: ok
          summary: ok
          risks: []
          blockers: []
          questions: []
          recommendation: {decision: go, rationale: блокеров нет}
steps:
  - emit:
      observation: procurement.notice_published
      source: eis
      payload:
        kind: procurement.notice_published
        data:
          kind: notice_published
          purchaseNumber: "0000000000026000009"
          purchase:
            number: "0000000000026000009"
            law: 44-FZ
            method: {code: EAP20, name: Электронный аукцион}
            customer: {name: ГБУ «Тестовый ЦИ», inn: "7700000001"}
            object: Развитие ИС учёта обращений
            okpd2: ["62.01.11.000"]
            maxPrice: {amount: "4000000.00", currency: RUB}
            deadlines: {submissionEnd: "2026-10-19T09:00:00+03:00"}
  - expect:
      memory: {recalled: [recall-history, recall-company, recall-roles, recall-offerings]}
      events: [process.recall_completed]
      data:
        history.2.key: "lesson:tender:0000000000025000007/1"
        history.2.text: Заказчик снижает цену на переторжке — закладывайте запас в расчёт
        advice.level: lessons
      tasks: [{step: go-no-go, assignee: alice, due: "2026-10-12T09:00:00+03:00"}]
  # решение не принято в срок: уровень 1 — напоминание исполнителю
  - advance: until:go-no-go
  - expect: {events: [process.timer_fired, process.escalated], tasks: [{step: go-no-go, status: open}]}
  # сутки спустя — уровень 2, генеральному директору
  - advance: until:go-no-go
  - expect: {events: [process.escalated]}
  - complete: {step: go-no-go, by: alice, output: {decision: no-go, reason: "урок: заказчик снижает цену, маржи нет"}}
  - expect: {status: completed, outcome: declined, data: {decision.reason: "урок: заказчик снижает цену, маржи нет"}}
