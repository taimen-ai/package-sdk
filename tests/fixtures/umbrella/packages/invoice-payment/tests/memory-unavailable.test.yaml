# yaml-language-server: $schema=../../../../../../schema/v1/test.schema.json
# База знаний не ответила за отведённое время: контрагент неизвестен, действующего
# договора нет — счёт идёт строгим маршрутом (финансовый директор), проверка — бухгалтерии.
process: invoice-payment
name: память недоступна — строгий маршрут
given:
  clock: "2026-10-01T09:00:00+03:00"
  principals:
    accounting: [1a000000-0000-4000-8000-000000000001, 1a000000-0000-4000-8000-000000000002]
    finance-director: [1f000000-0000-4000-8000-000000000001]
mocks:
  recall:
    - {step: recall-counterparty, timeout: true}
  skills:
    notify.send@1:
      - output: {notificationId: 0e000000-0000-4000-8000-000000000001, deliveries: [{channel: telegram, status: pending}]}
steps:
  - emit:
      observation: invoice.received
      payload:
        data: {invoice: "СЧ-2026-303", supplier: "ООО «Поставщик»", supplierInn: "7701234567",
               amount: 5000, currency: RUB, date: "2026-09-30", uploadedBy: 1a000000-0000-4000-8000-000000000001}
  - expect:
      data: {hasAgreement: false, reviewRole: accounting}
      tasks: [{step: check-invoice, assignee: "role:accounting"}]
  - complete: {step: check-invoice, by: 1a000000-0000-4000-8000-000000000002, output: {verdict: ok}}
  - expect: {data: {approverRole: finance-director, routeNote: "Нет действующего договора с контрагентом"}}
  - approve: {step: approve-payment, by: 1f000000-0000-4000-8000-000000000001, decision: reject}
  - expect: {status: completed, outcome: rejected}
