# yaml-language-server: $schema=../../../../../schema/v1/object.schema.json
# Пакет домена «не разработка» (конституция ст. I — нейтральность ядра доказывается
# пакетом другого домена; spec notifications, сценарий 6; spec process-packages,
# сценарий 11, SC-007). Только данные: ни ядро, ни сервис уведомлений не знают, что
# такое счёт.
#
# 0.2.0 (CP-ADR-0072): задача «проверить счёт» сдаёт заключение PDF, оплата получает
# его входом — передача файлов между задачами второго домена.
# 0.3.0 (TAI-ADR-0054, P024): процесс invoice-payment вместо правила invoice-received:
# проверка → согласование по порогу таблицей решений с разделением обязанностей и
# эскалацией по сроку → уведомление бухгалтерии notify.send@1 → оплата формой →
# закрытие с исходом; дело проецируется в память (контрагент по ИНН, счёт,
# заключение). Личность процесса — агент invoice-process.
# 0.4.0 (TAI-ADR-0056 Р15, K025): маршрут на базе знаний компании — recall контрагента
# по ИНН, его договоров (party_to) и подразделения, которое его ведёт (serves). Нет
# действующего на дату счёта договора или сумма выше его лимита — согласует финансовый
# директор, источник решения — договор; проверку ведёт роль подразделения контрагента,
# иначе бухгалтерия. В workspace должна быть включена онтология company@1 (пакет
# company-knowledge, коннектор учётной системы или загрузка таблиц); без базы знаний
# договоров нет, и каждый счёт согласует финансовый директор — строже, а не мягче.
# Процесс — версия 2: опубликованная версия 1 неизменна, её открытые дела дорабатывают
# на ней, новые счета идут по версии 2.
#
# Правило invoice-received выводится из оборота retire установки (WorkRule), а не
# renames: renames переносит объект того же вида под новым ключом (moved в
# Terraform), а здесь меняется вид — WorkRule уходит, Process приходит. Работы,
# заведённые правилом, остаются и доживают как были.
#
# На staging ставится в workspace «Оплата счетов (демо)» (${INVOICE_WORKSPACE_ID}) —
# см. guide «Уведомления и Telegram».
apiVersion: taimen.ai/v1
kind: Package
key: invoice-payment
spec:
  version: 0.4.0
  displayName: Invoice payment
  description: >-
    Оплата счёта поставщика процессом: проверка, согласование по порогу суммы с
    разделением обязанностей и по договору контрагента из базы знаний, уведомление
    бухгалтерии и оплата — пакет второго
    домена для проверки нейтральности ядра.
  requires: [notify]
  variables:
    ACCOUNTING_ROLE_ID:
      kind: role
      description: Роль бухгалтерии — ей адресуется уведомление о согласованной оплате
    INVOICE_WORKSPACE_ID:
      kind: workspace
      description: Workspace «Оплата счетов» — экземпляры процесса и задачи его шагов
