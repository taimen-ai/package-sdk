# yaml-language-server: $schema=../../../../../schema/v1/object.schema.json
# Производственные календари как данные (TAI-ADR-0054 п.6, plan process-packages Р6):
# рабочие и нерабочие дни по годам для сроков процессов (cal.* в выражениях).
# Календарь — вид каталога Calendar; ядро его не вычисляет из правил, а берёт
# отсюда. Новый год — новая запись в years после постановления Правительства.
apiVersion: taimen.ai/v1
kind: Package
key: platform-calendars
spec:
  version: 0.1.0
  displayName: Production calendars
  description: >-
    Производственные календари для сроков процессов: календарь РФ (ключ ru) —
    нерабочие праздничные дни по ст. 112 ТК РФ, переносы выходных по
    постановлениям Правительства РФ, рабочие выходные и предпраздничные
    сокращённые дни на 2025–2027 годы.
  requires: []
