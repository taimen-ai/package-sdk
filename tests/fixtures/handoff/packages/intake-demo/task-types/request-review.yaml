# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Рассмотрение заявки: поля предзаполняет шаг процесса; принять работу и согласовать
# продолжение после завершения решает держатель роли approvers.
apiVersion: taimen.ai/v1
kind: TaskType
key: request-review
spec:
  displayName: Request review
  description: A review of a request
  fieldSchema:
    type: object
    properties:
      request: {type: string}
      submittedBy: {type: string}
      decision: {type: string}
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [in_progress, done, cancelled]}
      - {from: in_progress, to: [todo, done, cancelled]}
    initialStatus: todo
    claimStatus: in_progress
    releaseStatus: todo
    completionStatus: done
  executorRoles: [approvers]
  completionSchema:
    onComplete:
      actions:
        - ensureWork:
            type: request-review
            key: follow-up:$.task.id
            title: Follow-up of $.task.publicId
            requestApproval: {assignee: "role:approvers"}
  acceptance:
    - key: review.approved
      kind: human
      description: An approver accepts the review
      spec: {approverRole: "role:approvers"}
