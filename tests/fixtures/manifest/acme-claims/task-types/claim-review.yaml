apiVersion: taimen.ai/v1
kind: TaskType
key: claim-review
spec:
  displayName: Claim review
  description: "Review a claim; refunds above ${CLAIMS_REFUND_THRESHOLD} need an approval"
  lifecycleSchema:
    statuses:
      - {key: todo, category: active, displayName: To do}
      - {key: done, category: terminal_success, displayName: Done}
      - {key: cancelled, category: terminal_cancelled, displayName: Cancelled}
    transitions:
      - {from: todo, to: [done, cancelled]}
    initialStatus: todo
    completionStatus: done
