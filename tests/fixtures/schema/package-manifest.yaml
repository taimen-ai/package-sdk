apiVersion: taimen.ai/v1
kind: Package
key: acme-claims
spec:
  version: 0.3.0
  displayName: Customer claims
  license: Apache-2.0
  authors: ["Acme Integrations <dev@example.com>"]
  homepage: https://git.example.com/acme/claims
  engines:
    control-plane: ">=0.9,<0.11"
  requires:
    - notify
    - {package: platform-calendars, version: ">=0.1"}
  knowledge: ["company@1", "claims@1"]
  variables:
    CLAIMS_WORKSPACE_ID:
      kind: workspace
      description: Root workspace of claims
      required: true
    CLAIMS_REFUND_THRESHOLD:
      kind: integer
      description: Refund amount above which an approval is required
      default: "50000"
