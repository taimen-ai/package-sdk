# yaml-language-server: $schema=../../../../../../schema/v1/object.schema.json
# Срок процесса — 3 рабочих дня с предупреждением за день; срок рассмотрения — 8 рабочих
# часов с предупреждением за 2 часа. Оба считает календарь office.
apiVersion: taimen.ai/v1
kind: Process
key: request-sla
spec:
  version: 1
  displayName: Request with SLA
  identity: {agent: request-sla-process}
  owner: [{role: reviewer}]
  calendar: office
  due: {workdays: 3, warnBefore: {workdays: 1}}
  data:
    type: object
    properties:
      request: {type: string}
      decision: {type: string}
  start:
    on: {observation: request.submitted}
    key: event.payload.id
    set: {request: event.payload.id}
  stages:
    - id: review
      steps:
        - id: review-request
          human:
            taskType: request-review
            assign: [{role: reviewer}]
            due: {workhours: 8, warnBefore: {workhours: 2}}
          output: {as: {decision: step.result.decision}}
        - id: close
          complete: {outcome: reviewed}
